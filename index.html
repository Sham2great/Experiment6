<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071522">
<meta name="description" content="A little Christmas world inside a snowglobe."><title>The North Pole Snowglobe</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="aurora" id="aurora"></div><canvas id="world" aria-label="Interactive snowy North Pole village snowglobe"></canvas>
<div class="shade"></div>
<header class="top"><a class="brand" href="#"><span class="brand-star">✳</span><span>THE NORTH POLE<br><small>SNOWGLOBE</small></span></a><div class="top-right"><span class="live"><i></i> NORTH POLE • LIVE</span><button class="icon-btn" id="soundBtn" aria-label="Toggle fireplace sound">♫ <span>Sound off</span></button></div></header>
<main>
<section class="hero"><p class="eyebrow">✦ A LITTLE CHRISTMAS MAGIC ✦</p><h1>Christmas is<br><em>in the air.</em></h1><p class="sub">A tiny world of wonder, waiting for you to shake things up.</p><div class="countdown"><div class="count-label">THE BIG DAY ARRIVES IN</div><div class="digits"><div><strong id="days">00</strong><span>DAYS</span></div><b>:</b><div><strong id="hours">00</strong><span>HOURS</span></div><b>:</b><div><strong id="minutes">00</strong><span>MINUTES</span></div><b>:</b><div><strong id="seconds">00</strong><span>SECONDS</span></div></div></div></section>
<div class="scene-hint"><span class="mouse">↔</span> DRAG TO TURN <span>•</span> SHAKE FOR SNOW</div>
<div class="controls"><button id="shakeBtn">❄ <span>Shake globe</span></button><button id="modeBtn">☾ <span>Night mode</span></button><button id="auroraBtn">✧ <span>Aurora on</span></button></div>
<section class="landmarks" aria-label="Explore the village"><button data-place="cabin"><span>⌂</span><b>THE CABIN</b><small>Warm wishes inside</small></button><button data-place="workshop"><span>⚒</span><b>TOY WORKSHOP</b><small>Made with magic</small></button><button data-place="tree"><span>✦</span><b>CHRISTMAS TREE</b><small>Make a little wish</small></button></section>
</main>
<footer><span>MADE WITH A LITTLE EXTRA MAGIC</span><button id="postcardBtn">MAKE A HOLIDAY POSTCARD ↗</button></footer>
<div class="modal-backdrop" id="modalBackdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><button class="close" id="closeModal" aria-label="Close">×</button><div id="modalContent"></div></section></div>
<script src="./app.js"></script>
</body></html>
